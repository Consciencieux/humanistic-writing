name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Match tag to VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?", tag):
              raise SystemExit("Expected vMAJOR.MINOR.PATCH[-prerelease]")
          if tag != "v" + version:
              raise SystemExit(f"Tag {tag} does not match VERSION {version}")
          PY

      - name: Check resources
        run: python scripts/package_skills.py check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build packages
        run: |
          python scripts/package_skills.py build
          python scripts/package_skills.py source

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          assets=(
            "dist/humanistic-writing-v${version}.zip"
            "dist/humanistic-writing-guide-v${version}.zip"
            "dist/humanistic-writing-audit-v${version}.zip"
            "dist/humanistic-writing-source-v${version}.zip"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          elif [[ "$version" == *-* ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "$RELEASE_TAG" --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "$RELEASE_TAG" --generate-notes
          fi
